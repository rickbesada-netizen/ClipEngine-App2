name: Build ClipEngine.exe

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0" # weekly (Monday 7am Sydney) so the YouTube downloader stays current

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the app page has no script errors
        shell: pwsh
        run: |
          $html = Get-Content app/static/index.html -Raw
          $m = [regex]::Matches($html, '(?s)<script>(.*?)</script>')
          Set-Content page-check.js $m[$m.Count - 1].Groups[1].Value
          node --check page-check.js
          if ($LASTEXITCODE -ne 0) { throw "The app page script has a syntax error" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Get deno (yt-dlp needs it for YouTube)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath denobin
          denobin\deno.exe --version

      - name: Build ClipEngine.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --noconsole --name ClipEngine
          --icon assets/ClipEngine.ico --version-file assets/version.txt
          --paths app --hidden-import pipeline
          --add-data "app/static;static" --add-data "app/fonts;fonts" --add-data "app/campaigns.json;." --add-data "app/tray.png;."
          --add-binary "denobin/deno.exe;."
          --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime --collect-all tokenizers
          --collect-all av --collect-all imageio_ffmpeg --collect-all yt_dlp --collect-all yt_dlp_ejs
          --collect-data cv2 --collect-submodules flask --collect-data googleapiclient --hidden-import youtube
          --hidden-import campaign_import --hidden-import kit --collect-all rapidocr_onnxruntime
          --collect-all pypdfium2 --collect-all pypdfium2_raw --collect-data docx --collect-submodules pystray
          app/server.py

      - name: Test the exe
        shell: pwsh
        run: |
          function Report($msg) {
            $log = Get-Content "dist\ClipEngine data\clip-engine.log" -Tail 25 -ErrorAction SilentlyContinue
            Write-Host "::error::$msg | log: $(($log -join ' // ') -replace '[\r\n]', ' ')"
            Get-Process ClipEngine -ErrorAction SilentlyContinue | Stop-Process -Force
            exit 1
          }
          $st = Start-Process dist\ClipEngine.exe -ArgumentList "--selftest" -Wait -PassThru
          $res = Get-Content "dist\ClipEngine data\selftest.txt" -ErrorAction SilentlyContinue
          Write-Host "selftest exit=$($st.ExitCode) result=$res"
          if ($res -ne "PASSED") { Report "Self-test failed (exit $($st.ExitCode), result '$res')" }
          $env:CLIP_ENGINE_NO_BROWSER = "1"
          $env:CLIP_ENGINE_NO_TRAY = "1"
          Start-Process dist\ClipEngine.exe | Out-Null
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest http://127.0.0.1:5050/api/state -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          if (-not $ok) { Report "App did not start" }
          # a second launch must hand over to the running copy and exit
          $p2 = Start-Process dist\ClipEngine.exe -PassThru
          if (-not $p2.WaitForExit(90000)) { Report "Second launch kept running instead of handing over" }
          Write-Host "second launch exit=$($p2.ExitCode)"
          Get-Process ClipEngine -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          Remove-Item -Recurse -Force "dist\ClipEngine data" -ErrorAction SilentlyContinue
          Write-Host "App started, answered, and a second launch handed over."

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Clip Engine for Windows (build ${{ github.run_number }})
          make_latest: true
          files: dist/ClipEngine.exe
          body: |
            **Download ClipEngine.exe below** and double-click it. Your browser opens Clip Engine.

            - Windows may say "Windows protected your PC" because the app isn't code-signed. Click **More info** then **Run anyway**.
            - Put the exe in its own folder (for example Documents\Clip Engine). Your clips are saved in a "ClipEngine data" folder next to it.
            - The first transcription downloads a speech model (about 150 MB, once).
            - Starting takes 10–20 seconds while it unpacks. Clip Engine then sits in the system tray (bottom-right, by the clock): click its icon to open it, right-click to quit.

            Built automatically from the latest code. A fresh build is made every week so the video downloader keeps working.
