name: Probe Whop page
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          pip install curl_cffi >/dev/null 2>&1
          cd probe && python3 - <<'PY' 2>&1 | tee status.txt
          import re
          from curl_cffi import requests
          sites = {
            'vyro': ['https://vyro.com', 'https://vyro.com/campaigns', 'https://app.vyro.com/campaigns', 'https://vyro.com/robots.txt', 'https://vyro.com/sitemap.xml', 'https://app.vyro.com/robots.txt'],
            'clippingnet': ['https://clipping.net', 'https://clipping.net/campaigns', 'https://clipping.net/dashboard/campaigns', 'https://clipping.net/robots.txt', 'https://clipping.net/sitemap.xml'],
            'clipaff': ['https://www.clipaffiliates.com', 'https://www.clipaffiliates.com/campaigns', 'https://www.clipaffiliates.com/robots.txt', 'https://www.clipaffiliates.com/sitemap.xml'],
            'elev8or': ['https://www.elev8or.io/bounty/clipping', 'https://www.elev8or.io/robots.txt', 'https://www.elev8or.io/sitemap.xml'],
            'promote': ['https://promote.fun', 'https://promote.fun/campaigns', 'https://promote.fun/robots.txt'],
          }
          n = 0
          for site, urls in sites.items():
              for u in urls:
                  n += 1
                  try:
                      r = requests.get(u, impersonate='chrome', timeout=30)
                      t = r.text
                      fn = f'{site}_{n}.txt'; open(fn, 'w').write(t)
                      title = (re.search(r'<title>(.*?)</title>', t, re.S) or [None, ''])[1][:70].strip()
                      keys = {k: t.lower().count(k) for k in ['cpm', 'budget', 'per 1k', 'campaign', '__next_data__', '__next_f', 'api.']}
                      apis = sorted(set(re.findall(r'https://[a-z0-9.-]*api[a-z0-9.-]*\.[a-z]+[/\w.-]{0,40}', t)))[:6]
                      print(fn, r.status_code, len(t), r.url, '|', title, '|', keys, apis)
                  except Exception as e:
                      print(site, u, 'ERR', str(e)[:100])
          PY
          cd ..
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -qm "probe output"; git push -q origin HEAD:probe
