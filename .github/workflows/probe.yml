name: Probe Whop page
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          pip install curl_cffi >/dev/null 2>&1
          cd probe && python3 - <<'PY' 2>&1 | tee status.txt
          import re, finder
          from curl_cffi import requests
          U = {
            'robots': 'https://contentrewards.com/robots.txt',
            'sitemap': 'https://contentrewards.com/sitemap.xml',
            'reach': 'https://contentrewards.com/reach',
            'cculture': 'https://contentrewards.com/clippingculture',
            'new': 'https://contentrewards.com/discover?sort=new',
            'page2': 'https://contentrewards.com/discover?page=2',
            'whop_cr': 'https://whop.com/contentrewards/',
            'whop_cc': 'https://whop.com/clippingculture/exp_zeADOv9rOOKk2x/app/',
          }
          for k, u in U.items():
              try:
                  r = requests.get(u, impersonate='chrome', timeout=30)
                  open(k + '.html', 'w').write(r.text)
                  n = len(finder.parse(r.text))
                  print(k, r.status_code, len(r.text), 'campaigns', n, 'final', r.url)
              except Exception as e:
                  print(k, 'ERR', e)
          print(open('robots.html').read())
          sm = open('sitemap.html').read()
          locs = re.findall(r'<loc>(.*?)</loc>', sm); print('sitemap locs', len(locs), locs[:15])
          for l in locs[:8]:
              if l.endswith('.xml'):
                  r = requests.get(l, impersonate='chrome', timeout=30); x = re.findall(r'<loc>(.*?)</loc>', r.text)
                  print('SUB', l, len(x), [y for y in x if 'campaign' in y][:5], x[:5])
          PY
          cd ..
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -qm "probe output"; git push -q origin HEAD:probe
