name: Probe Whop page
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          pip install curl_cffi >/dev/null 2>&1
          python3 -c "
          from curl_cffi import requests
          import re
          for name, u in [('list', 'https://contentrewards.com/discover'), ('robots', 'https://contentrewards.com/robots.txt')]:
              r = requests.get(u, impersonate='chrome'); open('probe/cr_'+name+'.html','w').write(r.text); print(name, r.status_code, len(r.text))
              r2 = __import__('urllib.request').request.urlopen(__import__('urllib.request').request.Request(u, headers={'User-Agent':'Mozilla/5.0 ClipEngine'}))
              print(name, 'plain', r2.status, len(r2.read()))
          h = open('probe/cr_list.html').read()
          ids = list(dict.fromkeys(re.findall(r'discover/([0-9a-f-]{36})', h)))
          print('ids', len(ids))
          if ids:
              r = requests.get('https://contentrewards.com/discover/' + ids[0], impersonate='chrome'); open('probe/cr_one.html','w').write(r.text); print('one', r.status_code, len(r.text))
          " 2>&1 | tee probe/status.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -qm "probe output"; git push -q origin HEAD:probe
