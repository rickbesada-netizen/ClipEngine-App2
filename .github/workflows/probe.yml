name: Probe Whop page
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          python3 -c "
          import urllib.request
          for name, u in [('one', 'https://contentrewards.com/discover/44a3ffcb-d4a1-492b-94a4-704919950246'), ('cpm', 'https://contentrewards.com/discover/9e1c0d8e-0000-0000-0000-000000000000')]:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent':'Mozilla/5.0 ClipEngine'}))
                  t = r.read().decode('utf-8','replace'); open('probe/cr_'+name+'.html','w').write(t); print(name, r.status, len(t))
              except Exception as e: print(name, e)
          " 2>&1 | tee probe/status.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -qm "probe output"; git push -q origin HEAD:probe
