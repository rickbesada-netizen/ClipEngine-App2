name: Probe Whop page
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          pip install curl_cffi >/dev/null 2>&1
          cd probe && python3 - <<'PY' 2>&1 | tee status.txt
          import re, finder, urllib.request
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': finder.UA}), timeout=30).read().decode('utf-8', 'replace')
          for u in ['https://vyro.com/campaigns?page=2', 'https://vyro.com/campaigns?p=2', 'https://vyro.com/campaigns/page/2', 'https://vyro.com/campaigns?page=2&limit=12']:
              try:
                  d, m = finder._vyro_page(get(u)); print(u, len(d), [c['slug'][:25] for c in d][:3], m.get('page'))
              except Exception as e: print(u, 'ERR', e)
          sm = get('https://vyro.com/sitemap/campaigns.xml'); locs = re.findall(r'<loc>(.*?)</loc>', sm); print('sitemap', len(locs), locs[:5])
          if locs:
              h = get(locs[0]); open('one.html', 'w').write(h); f = finder._flight(h)
              print('detail', len(h), f.count('payoutModel'), f.count('"budget"'))
              i = f.find('"payoutModel"'); print(f[max(0, i - 600):i + 300])
          PY
          cd ..
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -qm "probe output"; git push -q origin HEAD:probe
