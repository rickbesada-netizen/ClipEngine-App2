name: Probe Whop page
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          pip install curl_cffi >/dev/null 2>&1
          cd probe && python3 - <<'PY' 2>&1 | tee status.txt
          import re
          from curl_cffi import requests
          U = {
            'wf': 'https://whop.com/workforce/',
            'wf_exp': 'https://whop.com/workforce/exp_ieyoVFzMHM6BQo/',
            'wf_post': 'https://whop.com/workforce/exp_ieyoVFzMHM6BQo/post_1CfxHD47wq9DeDyp676W3T',
            'disc_wf': 'https://whop.com/discover/workforce/',
            'bounties': 'https://whop.com/bounties/',
            'cr_app1': 'https://whop.com/contentrewards/exp_B5C5S1vijHGVt9/app/',
            'cr_app2': 'https://whop.com/contentrewards/exp_KZckYGtrnbujDg/app/',
            'robots': 'https://whop.com/robots.txt',
            'sitemap': 'https://whop.com/sitemap.xml',
          }
          for k, u in U.items():
              try:
                  r = requests.get(u, impersonate='chrome', timeout=30)
                  open(k + '.html', 'w').write(r.text)
                  t = r.text
                  print(k, r.status_code, len(t), 'final', r.url, '| bounty', t.count('ounty'), 'title', (re.search(r'<title>(.*?)</title>', t) or [None, ''])[1][:80])
              except Exception as e:
                  print(k, 'ERR', e)
          print(open('robots.html').read()[:3000])
          sm = open('sitemap.html').read(); print('SITEMAP', re.findall(r'<loc>(.*?)</loc>', sm)[:40])
          PY
          cd ..
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -qm "probe output"; git push -q origin HEAD:probe
